name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A fonte se atualiza o dia todo. Uma coleta por dia basta e respeita o uso justo dela.
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # O dado bruto fica só na memória deste passo. O log é público e não imprime registro nenhum.
      - run: npm run dados
        env:
          CENSUS_SEGREDO: ${{ secrets.CENSUS_SEGREDO }}
          CENSUS_EXIGE_SEGREDO: ${{ github.event_name != 'pull_request' && '1' || '0' }}
      - run: npm run build
      - name: Guardar o resumo do dia
        if: github.event_name == 'schedule'
        run: |
          git config user.name marianabsctba
          git config user.email 62853909+marianabsctba@users.noreply.github.com
          git add historico/resumo.csv
          git diff --cached --quiet || git commit -m "chore(dados): atualiza o resumo do dia"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request'
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
